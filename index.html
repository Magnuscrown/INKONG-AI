<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>INKONG AI</title>
    <meta name="theme-color" content="#050505">
    <style>
        :root { --bg:#050505; --p:#111113; --ac:#8b93ff; --tx:#f3f3f5; }
        body { margin: 0; background: var(--bg); color: var(--tx); font-family: system-ui; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        #feed { flex: 1; overflow-y: scroll; scroll-snap-type: y mandatory; }
        .v-container { height: 100vh; scroll-snap-align: start; position: relative; background: #000; }
        
        .progress-bar-container { position: absolute; bottom: 60px; left: 0; width: 100%; height: 2px; background: rgba(255,255,255,0.2); z-index: 10; }
        .progress-line { height: 100%; width: 0%; background: #fff; transition: width 0.1s linear; }
        
        nav { height: 60px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; }
    </style>
</head>
<body>

    <main id="feed">
        <!-- Video containers injected here -->
        <div class="v-container" data-src="video1.mp4"></div>
        <div class="v-container" data-src="video2.mp4"></div>
    </main>

    <div class="progress-bar-container">
        <div class="progress-line" id="pb"></div>
    </div>

    <nav>
        <div>Home</div><div>Search</div><div>AI</div><div>Profile</div>
    </nav>

<script>
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            const container = entry.target;
            if (entry.isIntersecting) {
                if (!container.querySelector('video')) {
                    const v = document.createElement('video');
                    v.src = container.dataset.src;
                    v.loop = true; v.muted = true; v.autoplay = true;
                    v.style.width = '100%'; v.style.height = '100%'; v.style.objectFit = 'cover';
                    v.addEventListener('timeupdate', () => {
                        const p = (v.currentTime / v.duration) * 100;
                        document.getElementById('pb').style.width = p + '%';
                    });
                    container.appendChild(v);
                }
            } else {
                const v = container.querySelector('video');
                if (v) { v.pause(); v.remove(); }
            }
        });
    }, { threshold: 0.6 });

    document.querySelectorAll('.v-container').forEach(c => observer.observe(c));
</script>
</body>
</html>
